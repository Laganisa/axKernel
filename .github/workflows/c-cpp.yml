name: axOS Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            make \
            binutils-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          make all

      - name: Verify Build Output
        run: |
          if [ -f build/kernel/kernel8.elf ]; then
            echo "Build Success"
            ls -l build/kernel/kernel8.elf
          else
            echo "Build Failed"
            exit 1
          fi